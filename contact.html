<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | DataSync Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-gray-800 bg-gray-50">
  <header class="bg-white shadow">
    <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
      <a href="index.html" class="text-xl font-semibold text-blue-700">DataSync Solutions</a>
      <nav class="space-x-6">
        <a href="index.html" class="hover:text-blue-600">Home</a>
        <a href="services.html" class="hover:text-blue-600">Services</a>
        <a href="projects.html" class="hover:text-blue-600">Projects</a>
        <a href="about.html" class="hover:text-blue-600">About</a>
        <a href="contact.html" class="text-blue-700 font-medium">Contact</a>
      </nav>
    </div>
  </header>

  <main class="max-w-md mx-auto p-8">
    <h1 class="text-3xl font-bold text-blue-800 mb-6 text-center">Contact Us</h1>
    <p class="text-center mb-8 text-gray-600">We’d love to hear from you. Fill out the form below or email us directly.</p>

    <form action="https://formspree.io/f/your-form-id" method="POST" class="space-y-4">
      <input type="text" name="name" placeholder="Your name" class="w-full border p-3 rounded" required>
      <input type="email" name="email" placeholder="Your email" class="w-full border p-3 rounded" required>
      <textarea name="message" rows="5" placeholder="How can we help?" class="w-full border p-3 rounded" required></textarea>
      <button type="submit" class="bg-blue-700 text-white px-6 py-3 rounded-lg hover:bg-blue-800 w-full">Send Message</button>
    </form>
  </main>

  <footer class="bg-gray-100 py-6 text-center text-sm text-gray-600">
    © 2025 DataSync Solutions. All rights reserved.
  </footer>
</body>
</html>
