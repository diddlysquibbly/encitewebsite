<section class="max-w-md mx-auto p-8">
  <h1 class="text-3xl font-bold text-blue-800 mb-6 text-center">Contact Us</h1>
  <form action="https://formspree.io/f/your-form-id" method="POST" class="space-y-4">
    <input type="text" name="name" placeholder="Your name" class="w-full border p-3 rounded" required>
    <input type="email" name="email" placeholder="Your email" class="w-full border p-3 rounded" required>
    <textarea name="message" rows="5" placeholder="How can we help?" class="w-full border p-3 rounded" required></textarea>
    <button type="submit" class="bg-blue-700 text-white px-6 py-3 rounded-lg hover:bg-blue-800 w-full">Send Message</button>
  </form>
</section>
